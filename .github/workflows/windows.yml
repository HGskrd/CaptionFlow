name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install packaging tools
        timeout-minutes: 5
        run: |
          # Keep apt signature/hash verification; avoid unavailable archive DNS.
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's#https?://(azure.archive|archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' "$source"
            fi
          done
          sudo apt-get update -qq -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 nsis gcc-mingw-w64-x86-64-posix
      - run: python scripts/build-windows.py
      - run: makensis -DPAYLOAD="$PWD/dist/windows-staging/CaptionFlow" -DOUTPUT="$PWD/dist/CaptionFlow-Setup.exe" packaging/windows.nsi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CaptionFlow-Windows
          path: |
            dist/CaptionFlow-Setup.exe
            dist/CaptionFlow-Windows-x64.zip
  test:
    timeout-minutes: 15
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: CaptionFlow-Windows
          path: dist
      - name: Install and launch
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD\dist\CaptionFlow-Setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $install = "$env:LOCALAPPDATA\Programs\CaptionFlow"
          & "$install\python\python.exe" "$install\portable\launch.py" --smoke-test --data "$env:TEMP\CaptionFlow-smoke"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:TEMP\CaptionFlow-smoke\launcher.log"; throw 'Launch failed' }
          Copy-Item "$install\portable\caption_audio.dll" portable\caption_audio.dll
          & "$install\python\python.exe" -m unittest discover -s tests_portable -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Phonon offline inference and live replay
        shell: pwsh
        run: |
          $install = "$env:LOCALAPPDATA\Programs\CaptionFlow"
          & "$install\python\python.exe" scripts/test_small_models.py --cache "$env:TEMP\CaptionFlow-models" --backend cpu --download --output dist/phonon-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Real-model test failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Windows-model-evidence
          path: dist/phonon-windows.json
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift test
