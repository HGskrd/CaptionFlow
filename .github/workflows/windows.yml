name: Windows installer
on:
  workflow_dispatch:
    inputs:
      diagnose_run:
        description: Diagnose an existing Windows package run instead of building (optional)
        required: false
        type: string
      package_run:
        description: Re-test an existing Windows package with identical runtime inputs (optional)
        required: false
        type: string
      gpui_run:
        description: Reuse a GPUI-Windows artifact from a prior run with identical GPUI sources (optional)
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  gpui:
    if: inputs.diagnose_run == '' && inputs.package_run == ''
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify reusable GPUI sources
        if: inputs.gpui_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.gpui_run }}
        run: |
          $source = gh api "repos/${{ github.repository }}/actions/runs/$env:SOURCE_RUN" --jq .head_sha
          if ($LASTEXITCODE -ne 0) { throw 'Unknown source build' }
          git fetch origin $source --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify source commit' }
          git diff --exit-code $source HEAD -- gpui/src gpui/Cargo.toml gpui/Cargo.lock portable/resources/CaptionFlow.ico Sources/CaptionFlow/Resources/worker/release.json
          if ($LASTEXITCODE -ne 0) { throw 'GPUI inputs changed; a new build is required' }
      - uses: actions/download-artifact@v8.0.2
        if: inputs.gpui_run != ''
        with:
          name: GPUI-Windows
          path: gpui/target/release
          run-id: ${{ inputs.gpui_run }}
          github-token: ${{ github.token }}
      - name: Build GPUI
        if: inputs.gpui_run == ''
        shell: pwsh
        working-directory: gpui
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 test --locked
          if ($LASTEXITCODE -ne 0) { throw 'GPUI tests failed' }
          cargo +1.98.0 build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'GPUI build failed' }
      - name: Embed Windows activation manifest
        shell: pwsh
        run: |
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter mt.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\mt.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $mt) { throw 'Windows SDK manifest tool missing' }
          $exe = "$PWD\gpui\target\release\CaptionFlowGPUI.exe"
          & $mt.FullName -nologo -manifest "$PWD\gpui\windows.manifest" "-outputresource:$exe;#1"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest embedding failed' }
      - uses: ./.github/actions/sign-windows
        with:
          files: ${{ github.workspace }}\gpui\target\release\CaptionFlowGPUI.exe
          enabled: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          account: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          profile: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GPUI-Windows
          path: gpui/target/release/CaptionFlowGPUI.exe
  build:
    if: inputs.diagnose_run == '' && inputs.package_run == ''
    needs: gpui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install packaging tools
        timeout-minutes: 5
        run: |
          # Keep apt signature/hash verification; avoid unavailable archive DNS.
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's#https?://(azure.archive|archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' "$source"
            fi
          done
          sudo apt-get update -qq -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 nsis gcc-mingw-w64-x86-64-posix
      - uses: actions/download-artifact@v8.0.2
        with:
          name: GPUI-Windows
          path: dist
      - run: python scripts/build-windows.py
      - name: Build installer
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("Sources/CaptionFlow/Resources/worker/release.json"))["version"])')
          makensis -DVERSION="$VERSION" -DPAYLOAD="$PWD/dist/windows-staging/CaptionFlow" -DOUTPUT="$PWD/dist/CaptionFlow-Setup-All-in-One.exe" packaging/windows.nsi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CaptionFlow-Windows
          path: |
            dist/CaptionFlow-Setup-All-in-One.exe
            dist/CaptionFlow-Windows-x64.zip
  test:
    if: always() && inputs.diagnose_run == '' && (inputs.package_run != '' || needs.build.result == 'success')
    timeout-minutes: 15
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify reusable installer inputs
        if: inputs.package_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.package_run }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid source run' }
          $source = gh api "repos/${{ github.repository }}/actions/runs/$env:SOURCE_RUN" --jq .head_sha
          if ($LASTEXITCODE -ne 0) { throw 'Unknown package run' }
          git fetch origin $source --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify package source' }
          git diff --exit-code $source HEAD -- gpui Sources portable native scripts/build-windows.py scripts/build-audio.py packaging/assets packaging/windows.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer inputs changed; build a new installer' }
      - uses: actions/download-artifact@v8.0.2
        with:
          name: CaptionFlow-Windows
          path: dist
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - name: Upgrade legacy full-installer artifact name
        shell: pwsh
        run: |
          if (-not (Test-Path dist/CaptionFlow-Setup-All-in-One.exe)) {
            if ((Get-Item dist/CaptionFlow-Setup.exe).Length -lt 50MB) { throw 'Expected a complete installer' }
            Move-Item dist/CaptionFlow-Setup.exe dist/CaptionFlow-Setup-All-in-One.exe
          }
      - uses: ./.github/actions/sign-windows
        with:
          files: ${{ github.workspace }}\dist\CaptionFlow-Setup-All-in-One.exe
          enabled: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          account: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          profile: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Build online installer from the final complete-installer bytes
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis --yes --no-progress }
          python scripts/build-windows-installers.py --all-in-one dist/CaptionFlow-Setup-All-in-One.exe --output dist --test-url http://127.0.0.1:8847/CaptionFlow-Setup-All-in-One.exe
          if ($LASTEXITCODE -ne 0) { throw 'Online installer build failed' }
      - uses: ./.github/actions/sign-windows
        with:
          files: ${{ github.workspace }}\dist\CaptionFlow-Setup.exe
          enabled: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          account: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          profile: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      - name: Install and verify both download variants
        shell: pwsh
        run: ./scripts/test-windows-installers.ps1 -Directory dist -OnlineInstaller CaptionFlow-Setup-Loopback-Test.exe
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CaptionFlow-Windows-verified
          path: |
            dist/CaptionFlow-Setup.exe
            dist/CaptionFlow-Setup-All-in-One.exe
            dist/CaptionFlow-Windows-x64.zip
            dist/windows-installers.json
            dist/installer-test-report.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Windows-model-evidence
          path: |
            dist/phonon-offline.json
            dist/installer-test-report.json
  mac:
    if: inputs.diagnose_run == '' && inputs.package_run == ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift test
  diagnose:
    if: inputs.diagnose_run != ''
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: GPUI-Windows
          path: dist
          run-id: ${{ inputs.diagnose_run }}
          github-token: ${{ github.token }}
      - name: Inspect Windows loader imports
        shell: pwsh
        run: |
          python -m pip install pefile
          python scripts/check-windows-imports.py dist/CaptionFlowGPUI.exe
          if ($LASTEXITCODE -ne 0) { throw 'Import inspection failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Windows-startup-diagnostics
          path: dist/imports.json
