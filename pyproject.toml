[project]
name = "captionflow-linux-dev"
version = "0.0.0"
requires-python = ">=3.13,<3.15"
# Keep these pins aligned with portable/requirements-linux.txt for release parity.
dependencies = [
    "cffi==2.1.1",
    "cryptography==46.0.3",
    "numpy==2.3.5",
    "psutil==7.2.2",
    "pycparser==3.12",
    "pyside6-essentials==6.12.0",
    "rapidfuzz==3.14.3",
    "shiboken6==6.12.0",
    "soundcard==0.4.6",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'"]
no-build = true
